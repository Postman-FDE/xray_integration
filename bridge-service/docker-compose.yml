services:
  bridge:
    build: .
    container_name: bridge-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xray}:${POSTGRES_PASSWORD:-xray}@db:5432/${POSTGRES_DB:-xray_bridge}
    ports:
      - "${PORT:-3003}:3003"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: bridge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xray}
      POSTGRES_DB: ${POSTGRES_DB:-xray_bridge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xray}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
